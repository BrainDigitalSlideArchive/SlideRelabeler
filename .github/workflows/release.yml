# Build installers on tag push (v*) and attach them to a GitHub Release.
# Tag must match package.json version (e.g. v0.9.2 ↔ "version": "0.9.2").
# See docs/github-release-ci.md for signing secrets and release steps.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-guard:
    name: Check tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag equals v + package.json version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v${VERSION}"
          if [ "${TAG}" != "${EXPECTED}" ]; then
            echo "::error::Tag '${TAG}' does not match package.json version '${EXPECTED}'. Bump package.json, commit, then tag ${EXPECTED}."
            exit 1
          fi
          echo "OK: tag ${TAG} matches package.json version ${VERSION}"

  windows:
    name: Build Windows
    needs: version-guard
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: sliderelabeler
          environment-file: environment-windows.yml
          auto-activate-base: false
          conda-remove-defaults: true

      - name: Install npm dependencies
        shell: pwsh
        run: |
          (& conda "shell.powershell" "hook") | Out-String | Invoke-Expression
          conda activate sliderelabeler
          npm ci

      - name: Build (npm run make)
        shell: pwsh
        run: |
          (& conda "shell.powershell" "hook") | Out-String | Invoke-Expression
          conda activate sliderelabeler
          npm run make

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/make/squirrel.windows/**/SlideRelabeler Setup *.exe
          if-no-files-found: error

  macos-arm64:
    name: Build macOS arm64
    needs: version-guard
    runs-on: macos-latest
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: sliderelabeler
          environment-file: environment-macos.yml
          auto-activate-base: false
          conda-remove-defaults: true

      - name: Install npm dependencies
        shell: bash -el {0}
        run: npm ci

      - name: Build (npm run make)
        shell: bash -el {0}
        run: npm run make

      - name: Upload Mac zip
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: out/make/zip/darwin/arm64/*.zip
          if-no-files-found: error

  linux:
    name: Build Linux
    needs: version-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deb/rpm packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: sliderelabeler
          environment-file: environment-linux.yml
          auto-activate-base: false
          conda-remove-defaults: true

      - name: Install npm dependencies
        shell: bash -el {0}
        run: npm ci

      - name: Build (npm run make)
        shell: bash -el {0}
        run: npm run make

      - name: Upload deb and rpm
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            out/make/deb/**/*.deb
            out/make/rpm/**/*.rpm
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [windows, macos-arm64, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List release assets
        run: find release-assets -type f | sort

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SlideRelabeler ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | Asset |
            |----------|--------|
            | Windows | `SlideRelabeler Setup … .exe` (Squirrel installer) |
            | macOS (Apple Silicon) | `.zip` containing `SlideRelabeler.app` |
            | Linux | `.deb` (Debian/Ubuntu) and `.rpm` (Fedora/RHEL-family) |

            **Code signing:** These builds may be **unsigned**. On macOS, use Right-click → Open (or allow under System Settings → Privacy & Security) the first time. On Windows, SmartScreen may warn until Authenticode signing is configured.

            See [docs/github-release-ci.md](docs/github-release-ci.md) for how releases are built and which secrets enable signing.
          files: |
            release-assets/windows/**
            release-assets/macos-arm64/**
            release-assets/linux/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
