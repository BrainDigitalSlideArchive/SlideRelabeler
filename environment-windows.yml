name: sliderelabeler
channels:
  - conda-forge
  - defaults
dependencies:
  - pip
  - bzip2
  - ca-certificates
  - libjpeg-turbo
  - lerc
  - libdeflate
  - libexpat
  - libffi
  - libtiff
  - libzlib
  - lz4
  - nomkl
  - openssl
  - python=3.12
  - setuptools
  - vc
  - vc14_runtime
  - vs2015_runtime
  # Native build tools for sliderelabeler_czi_rw (libCZI ReplaceAttachment).
  - cmake
  - ninja
  - cxx-compiler
  - xz
  - zlib
  - zstd
  - imagecodecs
  - large-image
  - large-image-source-tiff
  - large-image-source-gdal
  - pip:
      - openslide-bin>=4.0.1
      - openslide-python
      - pyinstaller
      - lxml
      # Zeiss CZI: main-slide tiles + metadata via pylibCZIrw; attachments via czifile.
      # Attachment writer built by with-conda / build scripts (scripts/setup-czi-rw.ps1).
      - pylibCZIrw
      - czifile
      - pybind11
      - scikit-build-core
      # Required by the new gRPC-based Python engine (`src/python/engine.py`)
      # so Electron can complete the READY <port> handshake.
      - grpcio>=1.78.0
      - grpcio-health-checking
      # Keep protobuf new enough for generated stubs; engine_pb2.py indicates protoc 6.31.1.
      - protobuf>=6.31.1
      - large-image[common]
      - large-image-source-ometiff
      - pyproj
      - qrcode
      - pyvips[all]
      # Needed for Globus upload in dev, and for PyInstaller to freeze globus_cli into packaged builds
      - globus-cli
